
name: etl-combustiveis

services:
  postgres:
    image: postgres:16-alpine
    container_name: etl-combustiveis-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: combustiveis_dw
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d combustiveis_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
  

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: etl-combustiveis-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy
  
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: etl-combustiveis-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: combustiveis_dw
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres



volumes:
  postgres_data:
  pgadmin_data:
